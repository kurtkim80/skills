name: Automated Skills Sync & Deploy

on:
  schedule:
    # 매일 한국 시간 자정(00:00 KST = 15:00 UTC)에 자동 실행
    - cron: '0 15 * * *'
  # GitHub Actions 탭에서 언제든 'Run workflow' 버튼으로 수동 즉시 실행 가능
  workflow_dispatch:
  # sources.json에 새 저장소가 추가되어 push되면 즉시 자동 실행
  push:
    paths:
      - 'sources.json'

permissions:
  contents: write

concurrency:
  group: "skills-auto-sync"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Python 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install fastembed numpy

      - name: ⚙️ .NET 10 SDK 설정
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: 🔄 자동 에셋 수집, AI 벡터화 및 Blazor WASM 빌드
        run: |
          python auto_sync.py

      - name: 🚀 GitHub Pages 배포 및 변경사항 자동 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경사항 확인
          if [ -n "$(git status --porcelain)" ]; then
            echo "📦 변경사항 발견! 커밋 및 푸시를 진행합니다."
            git add .
            git commit -m "chore(auto-sync): Automated skills update & Blazor WASM rebuild [skip ci]"
            git push origin main
            echo "✅ GitHub Pages에 최신 스킬 배포 완료!"
          else
            echo "✨ 새로운 에셋이나 변경사항이 없습니다. 커밋을 건너뜁니다."
          fi
