# 升版触发条件见 references/criteria-governance.md §2A（band 的有无/映射值、no_severity 的有无＝必须升版）。
# SDA-Q4.1（2026-10-05）：LEN-01/STR-01 承档 + 五道改记 no_severity ⇒ 按 §2A 升版。
version: SDA-Q4.1
groups:
- ids: []
  title: A 组：脚本实算
  explain: |
    - **`FP-01` 报告指纹 == 被审文件当前指纹？** 取 `python3 <真源仓>/skill-audit-fp.py <技能名>` 的 12 位输出，与报告头 `审计指纹` 逐字符比。失配的处置见「报告文件」节（重跑审计，**不得手改指纹**）。
    - **`LEN-01` 折叠后字符数 ≤ 1024？** / **`LEN-02` 折叠后字符数（实算值）** —— 折叠口径见「工作流」步骤 1。`LEN-02` 的答案须为**裸数字**（类型化答案空间，见「判据集契约」），不得带单位或区间。超长 → **[高]**（`LEN-01` 自己承档；`STRUCT-01` 另判「空/吞正文」一类结构破坏，二者同档不互相转手）。
    - **`STR-01` frontmatter 闭合且未吞正文？** 查首个 `---` 之后是否有闭合 `---`，且 description 折叠块**不吞正文**（描述到正文前结束）——曾批量中招，防再次发生。结构破坏 → **[高]**。
    - **`NAM-01` `name` == 目录名？** 不一致标 **注意**（不判缺陷，属命名约定问题），在「问题」节以 [信息] 记。
    - **`REL-01` 报告头写的判据集版本 == 当前版本？** **只抄不判**（抄渲染出的版本号即可），不一致由校验器报。
- ids:
  - VOL-02
  - VOL-03
  - VOL-04
  title: 指向性数据是否已外置（VOL-02 ~ VOL-04）
  explain: |
    检查「稳定方法论 vs 易变数据」分层是否合理——防止正文/描述写死指向性数据（会过期、造成双源）：

    | 检查项 | 通过条件 | 归属题 |
    |--------|----------|--------|
    | 外置状态 | 该类数据应外置 `references/` 表（每表含 `lastUpdated` + `refreshInterval` + 置信度列）；SKILL.md 仅「查表」引用 | `VOL-02` |
    | 刷新频率 | `refreshInterval` **按数据稳定性定**（快变 30 天 / 中变 60 天 / 慢变 90-180 天），不一律一刀切 | `VOL-03` |
    | 防双源 | 正文示例不写死具体数值（写死 → 建议改查表引用）；description 不含易变数值 | `VOL-04` |

    - 正文写死易变数据且未外置 → **[低]**（会过期误导）。**快变/慢变不再分档**（该分档随一道已退役的旧题一起退出判据集，退役记录见 `criteria-governance.md`）：现役 `VOL-02`/`VOL-03`/`VOL-04` 的 `band` 一律是 `否: 低`
      （2026-10-05 第四轮独立审计 M5：此行原写「快变 → [中]」，而**就「快变/慢变」这件事**
      现行判据产不出 [中]——照此定档等于定一个不存在的档。
      ⚠ 本句初稿写成「现行判据里没有任何一道能产出 [中]」，**那是假的**：
      严重度阶梯的「中」行实算有 19 项，`criteria-set.yaml:26` 这句话与两节后的
      渲染表直接矛盾。2026-10-05 第六轮独立审计（分工 A）抓出。
      **教训**：限定词（「就这件事」）是陈述的一部分，漏掉它就是把局部真话说成全局假话）
    - 已外置且机制完整（lastUpdated + refreshInterval + 置信度）→ 通过
    - 已外置但 `refreshInterval` 一刀切（未按稳定性）→ 注意 **[低]**

    `VOL-02` 判的是三件套**齐不齐**（缺项 → [低]），`VOL-03` 判的是**分不分档**（一刀切 → [低]），`VOL-04` 判裸主机名/写死数值（正文写死数值 → [低]；description 含易变数值 → 同样计入，防双源）。
- ids:
  - PRQ-01
  - PRQ-02
  title: 判据前提归属（能力越界）
  explain: |
    `FOR-01` 管 description 面的**能力外借**（2026-10-04 整题重写）；本组管**正文判据表**里的**能力预设**——更隐蔽，且正则查不到。

    **为什么需要这一维**（实证与「能查/查不了」的对照）→ `references/patterns.md` §7.7 论证段。

    **答这两题时必读**（它们是 B 组必答面，不是选读）：三格枚举（前提／归属／缺前提时）＋按序定档 1–6 的定档表在 `references/criteria-governance.md` §7。

    **定档顺序不可换：规则 1（职责内）优先于 3/4/5（缺前提时）**——先问「这是不是它的职责」，再问「缺了会怎样」；反了会把「这技能本来就该管的事」判成缺陷。

    本组出的档位直接进报告「二、规范合规检查」与「七、验收标准」，严重度沿用 §7.7 规则 2／3／4／5 的 [高]/[中]/[低] 映射；`FOR-01` 的分工与本组版本记录同在 `criteria-governance.md`。

    **降级**：仓内无 `[M1]`/`[M2]` 档位表时答 `不适用`——**先确认本仓是否有这类表**，别把「本仓没有」与「技能越界」混为一谈（`PRQ-02` 的答案由 `PRQ-01` 决定，见 `SEV-01` 复算口径的「不叠加」）。
# `retired_methods` 是**存档，不是知识库**：它**不渲染**、`parse_criteria_set` 跳过作废题。
# ⚠ 本注释曾写「它没有任何消费者——纯堆着没人读」，**那是假的**
# （2026-10-05 第六轮独立审计分工 A 抓出）：`check_retired_archived()`（在
# `scripts/audit-criteria-set-check.py`）**双向消费**它并进 `--selftest`——
# 存档集合必须等于作废集合，缺一个或多一个都硬失败。
# 「不渲染」是对的（不进技能文档与用户视野），「没有消费者」是错的（有机器在读）。
# 留它的理由只有一个：**退役一道判据时，讲解原文不会跟着蒸发**——
# 判据可能复活（候补转正），也可能被人追问「当初为什么这么定」。
# **代价要说清**：它只在**判据集文件内**可查，技能文档与用户都看不到。
# 真正要长期可查的退役理由，落在 `references/criteria-governance.md`（那里有 §8.x 的沿革）。
# ⇒ **别把这里当「历史都在这儿」**：它在唯一源里，是为了让「判据与其讲解同生共死」成立。
retired_methods:
- ids:
  - COV-01
  title: COV-01 正文标志性能力是否全部进入 WHAT ~ WHEN？
  explain: |
    **先抽能力清单**（审计员做，判据问的是「抽出来的有没有全进描述」）。从正文归纳「描述应否覆盖」的条目，优先：

    **抽取前先剥离 fenced code**（` ``` `…` ``` `）：围栏内行首 `# …` 是注释/示例，**不得**当作 Markdown H1/标志性能力（曾误报 `config-scan`/`secrets-scan`/`cicd-pipeline` 等）。

    1. **标题/角色/何时使用** 中的核心任务（仅围栏外 `#` / 首个技能标题）
    2. **不可妥协原则 / 强制 / 必须交付**
    3. **工作流步骤名** 与关键产出物
    4. `metadata.patches`（若有）中的标志性约束
    5. **反模式**（`references/patterns.md`）里暗示的差异化能力（可选触发）

    每条标记优先级（**这个标记决定 `COV-01` 的档位**）：

    - **标志性**：无此则不像本技能（缺 → 倾向 **[高]**）
    - **重要**：强制交付或专节（缺 → **[中]** 或弱覆盖 **[低]**）
    - **细节**：表格字段、实现微规则（描述省略通常 **可接受**）

    **`COV-01` 的 `band` 取 `低..高` 区间 ⇒ 复算按上界**：因为「判据只问有缺口吗」，缺口的档位由审计员按上面的优先级定。**代价**：报出的「不一致」不等于报告写错了，多数时候是该题档位本就不该到那么重——所以复算**只告警、不硬失败**（硬约束 2：判据不判裁决）。

    **两个 `不适用` 的用法（都是真情形，但都要举证）**：
    ① **user-invoked 技能**（`disable-model-invocation` 为真）——它不由触发词决定是否被调起，
       缺触发词不是缺陷。**证据须写明该字段为真。**
    ② **正文抽不出任何标志性能力**的退化情形（如 thin-allowlist）——**证据须给出该退化事实**。
    **不要用它回避举证**——两档都要求证据，校验器也会查证据列非空。
    **注意**：user-invoked 的 `不适用` 与本题 `band` 的 `低..高` 无关；填了 `不适用` 就**不参与
    `SEV-01` 复算**，不会因取上界被抬成 [高]（2026-10-04 独立审计指出：改前这里写着「`不适用`
    只给退化情形」，与新适用前提互斥，照此会否掉正确档、退回 `否` ⇒ 复算取上界 [高]，
    **比原来的假 [中] 更重**）。
- ids:
  - COV-03a
  - COV-03b
  - COV-03c
  title: COV-03a ~ COV-03b ~ COV-03c 触发面三面（进入面 ~ 边界面 ~ 执行门槛）
  explain: |
    **三面差别**（同一套判据集、三个答案，别混）：

    - **进入面**（`COV-03a`）：缺它 ⇒ **本该进来却进不来**的请求进不来（能力词/进入条件）。
    - **边界面**（`COV-03b`）：缺它 ⇒ **本不该进来却进来了**的请求进来（排除域/适用门槛）。
    - **执行门槛**（`COV-03c`）：缺它 ⇒ 请求**进得来但可能跑不起来**（身份/运行环境/工具可得性/入口来源）。

    **进入面判什么**（v1.5.0 起，§「pushy 质量」的实质内容）：

    - **标志性能力有触发词**：正文每条标志性能力（`COV-01` 抽取的清单）都能在 description 找到对应触发词（用户可能的口头说法）→ 缺 → **[中]**（标志性能力无触发词 = 该能力永远不被触发）。
      **⚠ 本条有适用前提（2026-10-04 用户裁定）**：它只对**靠自动触发**的技能成立。
      `disable-model-invocation: true`（仅用户显式调用）的技能**不由触发词决定是否被调起**，
      此时缺触发词**不是缺陷** ⇒ 判 `不适用` 并在证据里说明「该技能为 user-invoked」。
      **答案空间现含「不适用」档**（v1.32.0 补）——没有这一档时，审 user-invoked 技能必然假 [中]。
    - **场景密度**：WHEN 含 ≥2 个具体使用场景/触发时刻（「何时/什么情况下用」），非泛泛「when needed/必要时」→ 泛泛或只有 1 个场景 → **[低]**（建议补场景示例）。
    - **关键词覆盖**：高频触发词（技能领域专有名词/常见短语）已在 WHEN → 缺失 → **[低]**。
    - 过宽还是过窄：WHEN **过宽**（易误激活）见「边界面」；**过窄**（标志性能力无触发词）见上第一条。
    - 双语重复（英文等价词）：**不默认判缺陷**；可标 **[低]/token** 信息项。面向双语环境时 WHEN 应含英文等价。

    **边界面判什么**（误触发防护）：

    - **WHEN 过宽**：description 含泛动词+泛领域组合（如 `analyzing source code` + `maintenance/refactoring`）会命中不相关请求 → 建议**收窄 Use when**（明确「分析什么、何时用」）+ 加**反触发**（`NOT for` / `DO NOT TRIGGER when`——以**能力/任务**划界，不点名替代技能，见 `FOR-01`）。判定：WHEN 过宽缺反触发 → **[中]**（实测误命中）或 **[低]**（潜在风险）。
    - **反触发完整**：易误触发技能（泛动词+泛领域组合）已有 NOT for 以任务/能力划界 → 缺 → **[中]**（实测误命中）或 **[低]**（潜在）。
    - 反触发格式示例：`NOT for: single-file edits, or authoring/editing any skill's SKILL.md — no skill name implied (boundaries by task, not by who else could do it).`
    - 教训来源：2026-08 deep-codebase-analysis 被「审计技能」类请求**误命中 3 次**。

    **与 skill-eval 的分工**：本组是**静态评估**——「触发词写没写、够不够」；触发后行为是否真的正确（pass-rate）归 `skill-eval`（动态行为评估）。审计建议可写「若触发仍不理想，走 skill-eval 行为验证」。

    **动态触发测量（agentskills.io trigger-eval 方法）**：静态检查之外，触发可靠性可用官方推荐方法实测——构造约 20 条 eval 查询（8–10 条应触发 / 8–10 条**近似但不应触发**），每条跑 3 次算 **trigger rate**（阈值 0.5），按 60/40 切 **train / validation** 防过拟合，迭代约 5 轮。本技能只给静态判定与查询集设计建议；跑测与 pass-rate 归 `skill-eval`（来源：agentskills.io `skill-creation/optimizing-descriptions`）。

    **举证硬要求（`COV-03a`/`03b` 不满足即该题作废）**：

    完整的逐题作答指引（怎么剔四类非能力项、清单怎么列、`是`/`否` 各附什么、三面差别、举例与踩坑订正）见 `references/patterns.md` 的「COV-03a / 03b 举证硬要求」节，**在逐题作答这三题时才需要读**（它在作答路径上，不是按需查阅）；下面三条最硬的不能丢：

    1. **列清单前先剔四类非能力项**（执行纪律／反模式举例／对子代理的治理条款／工具调用样板）；
    2. 判 `是` 须附 **≥2 句具体用户话语**（并写明缺它路由结果如何改变）；
    3. 判 `否` 须对清单里**每个**被列项逐项给反证。
- ids:
  - LANG-01
  title: 正文与 description 的主语言是否一致？
  explain: |-
    **判什么**：description 与正文的主要语言是否相同。

    **为什么合计量只有 0.1% 还要留**——**入选标准不是患病率，是
    「失效在审计时刻是否可观察」**。描述中文、正文英文时，
    agent 在**只看 description 的那一刻完全看不出问题**，
    选中并读完正文才发现语言割裂。**低患病率 ≠ 无后果。**


    > **本节已并入 `STRUCT-01`**（2026-10-05 独立审计后）：与该题讲解表里的「语言一致性」行重复且档位冲突。此处逐字留存备查，不再渲染。
- ids:
  - VOL-01
  title: 指向性数据是否全部外置到 references/ 表？
  explain: |
    **退役题面（逐字存档）**：指向性数据（模型窗口/价格/API 端点与 ID/外部工具行为/统计数字/版本号）是否**全部**已外置到 `references/` 表？

    **原档位**：`否: 中..高`（快变数据未外置判 [中]，慢变判 [低]）——**这两档现已无任何现行判据能产出**：
    快变/慢变之分随本题一起退役，现行由 `VOL-02`（`否: 低`）与 `VOL-04`（`否: 低`）承担可判部分。

    **为什么退役**：对「指向性数据」这个**无界集合**问全称「全部」——集合没有分母，
    正面答案（全部外置了）永远不可证伪。这与 `COV-01`/`COV-03a~c` 是同一个病，
    不是本题特别不该留。

    **长期可查的退役理由在** `references/criteria-governance.md`（判据集演进记录）；
    本组只是**逐字存档**，供回溯当时怎么判的。
- ids:
  - DEP-01
  title: 正文声明需要的外部依赖，在技能使用者的环境里是否可得？
  explain: |-
    **判什么**：正文声明需要的外部依赖（工具、库、服务），在使用环境里是否取得到。

    **与 `RUN-01` 分开的理由**：入口是「**声明的东西存不存在**」（查路径），
    依赖是「**需要的东西拿不拿得到**」（查环境）——**判据形状不同，
    并成一条会把两套误报打包**。

    **环境作用域**同 `RUN-01`。

    **为什么是 B 组而不是 A 组**（2026-10-05 独立审计抓到的洞的同类）：
    「外部依赖可得不可得」**在审计者的机器上机械可判**——但那判的是**审计环境**，
    不是使用环境，**方向就是错的**（领域模型规则 3）。真源是用户显式提供的环境声明，
    那要人给。⇒ **标 A 会有脚本，但脚本判的是错的东西——比没有脚本更坏。**
    与 `RUN-01` 的分工：入口是**技能包内**的相对路径（查包即得，属 A）；
    依赖是**包外**的（须问环境，属 B）。

    **失效方向**：进得来但跑不起来——请求被选中了，agent 动手才炸。


    > **本条已退役**（2026-10-05 独立审计后）：无分母。逐字留存备查，不再渲染。
