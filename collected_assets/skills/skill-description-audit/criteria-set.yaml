  tier: ①
- id: D↔他件
  desc: 能力外借：本件该自陈的能力是否被指向别件
  dir: 单向
  tier: ②
- id: 入口面↔规范
  desc: name 合规且等于目录名、字段类型对、description 非空且不超长
  dir: 单向
  tier: ①
- id: B↔规范
  desc: 正文是否超出建议体量
  dir: 单向
  tier: ①
- id: B↔环境
  desc: 按承诺行动：声明的依赖与入口（命令名/路径/参数）在使用环境里是否可达
  dir: 单向
  tier: ①
- id: 入口面↔流程
  desc: 技能属性（高影响面／元技能）决定审计的调用纪律
  dir: 单向
  tier: ②
- id: 轮次
  desc: 审计过程自身：快照一致、只读、报告＝最后一次写入
  dir: —
  tier: ①
- id: 判据集
  desc: 判据集自身：版本恒定、题 ID 唯一、答案空间可判
  dir: —
