  desc: 外置文件自身：是否带刷新标记、字段是否齐、是否已过时
  dir: 内部
  tier: ①
- id: N↔D
  desc: 名字暗示的能力范围 ＝ description 声称的范围
  dir: 单向
  tier: ②
